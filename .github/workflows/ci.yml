name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]  # CI em push apenas para main

jobs:
  test-and-validate:
    name: Test and Validate
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        node-env: [development, staging, production]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: |
          npx nx lint backend
          npx nx lint frontend
      
      - name: Run unit tests
        run: |
          npx nx test backend --configuration=ci
          npx nx test frontend --configuration=ci
          npx nx test interfaces --configuration=ci

      - name: Install Playwright browsers
        if: matrix.node-env == 'development'
        run: npx playwright install --with-deps

      - name: Run e2e tests
        if: matrix.node-env == 'development'
        env:
          NODE_ENV: test
        run: |
          npx nx e2e backend-e2e --configuration=e2e
          npx nx e2e frontend-e2e
      
      - name: Build with NODE_ENV=${{ matrix.node-env }}
        env:
          NODE_ENV: ${{ matrix.node-env }}
        run: |
          echo "Testing build with NODE_ENV=${{ matrix.node-env }}"
          npx nx build backend --configuration=production
          npx nx build frontend --configuration=production
      
      - name: Test environment validation
        env:
          NODE_ENV: ${{ matrix.node-env }}
          DATABASE_TYPE: sqlite
          DATABASE_PATH: ${{ runner.temp }}/loan-system/data.db
        run: |
          echo "Testing app startup with NODE_ENV=${{ matrix.node-env }}"
          timeout 10s node dist/apps/backend/main.js || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -ne 124 ]; then
            echo "App failed to start with NODE_ENV=${{ matrix.node-env }}"
            exit 1
          fi
          echo "✅ App started successfully with NODE_ENV=${{ matrix.node-env }}"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-24.04
    needs: test-and-validate
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Build Docker image
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile.prod \
            -t loan-system:test \
            .
      
      - name: Test container startup with staging environment
        run: |
          docker run -d \
            --name test-container \
            -p 8080:8080 \
            -e NODE_ENV=staging \
            loan-system:test

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              break
            fi
            sleep 2
          done

          if curl -fsS http://localhost:8080/api/health; then
            echo
            echo "✅ Container started and the API is healthy"
          else
            echo "❌ Container failed to start"
            docker logs test-container
            exit 1
          fi

          # Angular deep links must be served by the backend (SPA fallback)
          curl -fsS -o /dev/null -w "Deep link /loans/list -> HTTP %{http_code}\n" http://localhost:8080/loans/list

          docker stop test-container || true
          docker rm test-container || true
